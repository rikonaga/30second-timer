<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TIDY IN 60</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
    background:linear-gradient(180deg,#FFFFFF,#FFF5F8);
    flex-direction:column;

    transition:background 2s linear;
}

h1{
    font-size:60px;
}  

#time{
    font-size:80px;
    font-weight:bold;
}

    #plant{

    font-size:80px;

    margin:20px;

}
    #record{
    font-size:24px;
    margin-bottom:20px;
}
    
    #streak{

    font-size:24px;

    margin-bottom:20px;

}

    #calendarButton{

    margin-top:30px;

    padding:10px 20px;

    font-size:18px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}

#calendar{

    margin-top:20px;

    font-size:22px;

    text-align:center;

}

#week {
    display: grid;
    grid-template-columns: repeat(7, 40px);
    justify-content: center;
    margin-top: 10px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 0;
}

#days {
    display: grid;
    grid-template-columns: repeat(7, 40px);
    justify-content: center;
    margin-top: 10px;
    row-gap: 10px;
    text-align: center;
}

#days span {
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    white-space: nowrap;
}

#startButton {
    margin: 20px;
    padding: 14px 36px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #73545D;
    background: #FFE8F0;
    border: 2px solid #F3C5D4;
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}

#startButton:hover {
    background: #FFD9E5;
    transform: scale(1.03);
}

#startButton:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
} 

    .done{

    color:green;

    font-weight:bold;

}

.notdone{

    color:#666;

}
    
</style>

</head>

<body>

<h1>TIDY IN 60</h1>

<div id="record"> ✨TIDY 0days</div>  

<div id="streak"> 🔥STREAK 0days</div>

<button id="startButton">▶ START</button>

<div id="time">60</div>

<button id="calendarButton"> 🗓️Monthly Record</button>

<div id="calendar"></div>

<script>

let count = 60;

let audioCtx;

let calendarVisible = false;

function updateRecord(){

    let records = JSON.parse(localStorage.getItem("records")) || [];

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth()+1).padStart(2,"0");

    const thisMonth = `${year}-${month}`;

    const monthlyRecords = records.filter(date => date.startsWith(thisMonth));

    document.getElementById("record").textContent =
        ` ✨TIDY ${monthlyRecords.length}days`;

}    

function updateStreak(){

    let records = JSON.parse(localStorage.getItem("records")) || [];

    records.sort();

    let streak = 0;

    let today = new Date();

    // 今日記録がなければ昨日から数え始める
    if(!records.includes(today.toLocaleDateString("sv-SE"))){
        today.setDate(today.getDate()-1);
    }

    while(true){

        const dateString = today.toLocaleDateString("sv-SE");

        if(records.includes(dateString)){

            streak++;

            today.setDate(today.getDate()-1);

        }else{

            break;

        }

    }

    document.getElementById("streak").textContent =
    `🔥STREAK ${streak}days`;

}

 function showCalendar(){

    if(calendarVisible){

    document.getElementById("calendar").innerHTML = "";

    calendarVisible = false;

    return;

} 

    let records = JSON.parse(localStorage.getItem("records")) || [];

    const now = new Date();

    const year = now.getFullYear();

    const month = now.getMonth();

    const firstDay = new Date(year, month, 1);

    const lastDay = new Date(year, month + 1, 0);

    let html = `
    <h2>${year}年${month + 1}月</h2>
    <div id="week">
        <span>日</span>
        <span>月</span>
        <span>火</span>
        <span>水</span>
        <span>木</span>
        <span>金</span>
        <span>土</span>
    </div>
    <div id="days">
`;

// 1日の曜日まで空のマスを入れる
for (let i = 0; i < firstDay.getDay(); i++) {
    html += "<span></span>";
}

// 日付を並べる
for (let day = 1; day <= lastDay.getDate(); day++) {

    const dateString =
        `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

    if (records.includes(dateString)) {
        html += `<span class="done">🌸${day}</span>`;
    } else {
        html += `<span class="notdone">${day}</span>`;
    }
}

html += "</div>";

document.getElementById("calendar").innerHTML = html;

calendarVisible = true;

}

const colors = [

"linear-gradient(180deg,#FFFFFF,#FFF5F8)",

"linear-gradient(180deg,#FFF5F8,#FFE8F0)",

"linear-gradient(180deg,#FFE8F0,#FFD9E5)",

"linear-gradient(180deg,#FFD9E5,#FFC9D9)",

"linear-gradient(180deg,#FFC9D9,#F9B5CC)",

"linear-gradient(180deg,#F9B5CC,#F3A1BF)",

"linear-gradient(180deg,#F3A1BF,#E88EAF)"

];

    function playFinishSound(){

    // 音声の管理
let musicInterval = null;
let masterGain = null;

// カフェ風BGMを開始
function startBGM() {

    if (!audioCtx) {
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    audioCtx.resume();

    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime
    );

    masterGain.gain.linearRampToValueAtTime(
        0.08,
        audioCtx.currentTime + 1
    );

    masterGain.connect(audioCtx.destination);

    // 穏やかなコード進行
    const chords = [
        [261.63, 329.63, 392.00], // C
        [220.00, 261.63, 329.63], // Am
        [174.61, 220.00, 261.63], // F
        [196.00, 246.94, 293.66]  // G
    ];

    let chordIndex = 0;

    function playChord() {

        if (!audioCtx || !masterGain) return;

        const chord = chords[chordIndex];

        chord.forEach((frequency, index) => {

            const oscillator = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = frequency;

            const now = audioCtx.currentTime;
            const startTime = now + index * 0.12;

            noteGain.gain.setValueAtTime(
                0.0001,
                startTime
            );

            noteGain.gain.linearRampToValueAtTime(
                0.3,
                startTime + 0.15
            );

            noteGain.gain.exponentialRampToValueAtTime(
                0.0001,
                startTime + 1.5
            );

            oscillator.connect(noteGain);
            noteGain.connect(masterGain);

            oscillator.start(startTime);
            oscillator.stop(startTime + 1.6);
        });

        chordIndex = (chordIndex + 1) % chords.length;
    }

    playChord();

    musicInterval = setInterval(playChord, 1800);
}


// BGMを徐々に止める
function stopBGM() {

    if (musicInterval !== null) {
        clearInterval(musicInterval);
        musicInterval = null;
    }

    if (masterGain && audioCtx) {

        const now = audioCtx.currentTime;

        masterGain.gain.cancelScheduledValues(now);

        masterGain.gain.setValueAtTime(
            Math.max(masterGain.gain.value, 0.0001),
            now
        );

        masterGain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.5
        );

        const oldGain = masterGain;
        masterGain = null;

        setTimeout(() => {
            oldGain.disconnect();
        }, 600);
    }
}


// 終了チャイム
function playFinishSound() {

    if (!audioCtx) return;

    const notes = [659.25, 783.99, 1046.50];

    notes.forEach((frequency, index) => {

        const oscillator = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const startTime =
            audioCtx.currentTime + index * 0.18;

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(0.0001, startTime);

        gain.gain.linearRampToValueAtTime(
            0.18,
            startTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            startTime + 0.55
        );

        oscillator.connect(gain);
        gain.connect(audioCtx.destination);

        oscillator.start(startTime);
        oscillator.stop(startTime + 0.6);
    });
}
const timer = setInterval(function(){

  // タイマー開始
function startTimer() {

    const startButton = document.getElementById("startButton");

    // 二重スタートを防ぐ
    startButton.disabled = true;
    startButton.textContent = "TIDYING...";

    // BGMを開始
    startBGM();

    const timer = setInterval(function() {

        count--;

        document.getElementById("time").textContent = count;

        // 背景グラデーションを更新
        let stage = Math.floor((60 - count) / 10);

        document.body.style.background = colors[stage];

        if (count <= 0) {

            clearInterval(timer);

            document.getElementById("time").textContent = "YOU DID IT！";

            // BGMを止めて終了チャイム
            stopBGM();
            playFinishSound();

            // 今日の日付を取得
            const today = new Date().toLocaleDateString("sv-SE");

            // 記録を保存
            let records = JSON.parse(
                localStorage.getItem("records")
            ) || [];

            if (!records.includes(today)) {
                records.push(today);
                localStorage.setItem(
                    "records",
                    JSON.stringify(records)
                );
            }

            // 記録と連続日数を更新
            updateRecord();
            updateStreak();

            startButton.textContent = "COMPLETED!";
        }

    }, 1000);
}


// スタートボタンにイベントを登録
document.getElementById("startButton")
    .addEventListener("click", startTimer);


// 初期表示を更新
updateRecord();
updateStreak();

// カレンダーボタン
document.getElementById("calendarButton")
    .addEventListener("click", showCalendar); 
updateRecord();

updateStreak();

document.getElementById("calendarButton")
.addEventListener("click", showCalendar);


</script>

</body>
</html>
