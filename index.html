<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TIDY IN 60</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
    background:linear-gradient(180deg,#FFFFFF,#FFF5F8);
    flex-direction:column;

    transition:background 2s linear;
}

h1{
    font-size:60px;
}  

#time{
    font-size:80px;
    font-weight:bold;
}

    #plant{

    font-size:80px;

    margin:20px;

}
    #record{
    font-size:24px;
    margin-bottom:20px;
}
    
    #streak{

    font-size:24px;

    margin-bottom:20px;

}

    #calendarButton{

    margin-top:30px;

    padding:10px 20px;

    font-size:18px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}

#calendar{

    margin-top:20px;

    font-size:22px;

    text-align:center;

}

#week{

    margin-top:10px;

    font-weight:bold;

    letter-spacing:8px;

}

 #days{

    margin-top:10px;

    line-height:2;

} 

    .done{

    color:green;

    font-weight:bold;

}

.notdone{

    color:#666;

}
    
</style>

</head>

<body>

<h1>TIDY IN 60</h1>

<div id="record">📅 TIDY 0days</div>  

<div id="streak">🔥STREAK 0days</div>

<div id="time">60</div>

<button id="calendarButton">📊 Monthly Record</button>

<div id="calendar"></div>

<script>

let count = 60;

let audioCtx;

let calendarVisible = false;

function updateRecord(){

    let records = JSON.parse(localStorage.getItem("records")) || [];

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth()+1).padStart(2,"0");

    const thisMonth = `${year}-${month}`;

    const monthlyRecords = records.filter(date => date.startsWith(thisMonth));

    document.getElementById("record").textContent =
        `📅 TIDY ${monthlyRecords.length}days`;

}    

function updateStreak(){

    let records = JSON.parse(localStorage.getItem("records")) || [];

    records.sort();

    let streak = 0;

    let today = new Date();

    // 今日記録がなければ昨日から数え始める
    if(!records.includes(today.toLocaleDateString("sv-SE"))){
        today.setDate(today.getDate()-1);
    }

    while(true){

        const dateString = today.toLocaleDateString("sv-SE");

        if(records.includes(dateString)){

            streak++;

            today.setDate(today.getDate()-1);

        }else{

            break;

        }

    }

    document.getElementById("streak").textContent =
    `🔥STREAK ${streak}days`;

}

 function showCalendar(){

    if(calendarVisible){

    document.getElementById("calendar").innerHTML = "";

    calendarVisible = false;

    return;

} 

    let records = JSON.parse(localStorage.getItem("records")) || [];

    const now = new Date();

    const year = now.getFullYear();

    const month = now.getMonth();

    const firstDay = new Date(year, month, 1);

    const lastDay = new Date(year, month + 1, 0);

    let html = `
        <h2>📅 ${year}年${month+1}月</h2>
        <div id="week">
        日　月　火　水　木　金　土
        </div>
        <div id="days">
    `;

    // 1日の曜日まで空白を入れる
    for(let i=0; i<firstDay.getDay(); i++){
        html += "　　";
    }

    // 日付を並べる
    for(let day=1; day<=lastDay.getDate(); day++){

    const dateString =
        `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    if(records.includes(dateString)){

        html += `<span class="done">🌱${day}</span> `;

    }else{

        html += `<span class="notdone">${day}</span> `;

    }

    if((firstDay.getDay()+day)%7==0){
        html += "<br>";
    }

}

    html += "</div>";

    document.getElementById("calendar").innerHTML = html;

    calendarVisible = true;

}

const colors = [

"linear-gradient(180deg,#FFFFFF,#FFF5F8)",

"linear-gradient(180deg,#FFF5F8,#FFE8F0)",

"linear-gradient(180deg,#FFE8F0,#FFD9E5)",

"linear-gradient(180deg,#FFD9E5,#FFC9D9)",

"linear-gradient(180deg,#FFC9D9,#F9B5CC)",

"linear-gradient(180deg,#F9B5CC,#F3A1BF)",

"linear-gradient(180deg,#F3A1BF,#E88EAF)"

];

    function playFinishSound(){

    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.frequency.value = 880;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.4);
}
const timer = setInterval(function(){

    count--;

    document.getElementById("time").textContent = count;

    let stage = Math.floor((60-count)/10);

    document.body.style.background = colors[stage];

    if(count <= 0){

        clearInterval(timer);

        document.getElementById("time").textContent="片付け完了！";

        playFinishSound();

        const today = new Date().toLocaleDateString("sv-SE");

        console.log(today);

        let records = JSON.parse(localStorage.getItem("records")) || [];

        if (!records.includes(today)) {
            records.push(today);
            localStorage.setItem("records", JSON.stringify(records));
        }

        console.log(records);

        updateRecord();

        updateStreak();
    }

},1000);
updateRecord();

updateStreak();

document.getElementById("calendarButton")
.addEventListener("click", showCalendar);


</script>

</body>
</html>
